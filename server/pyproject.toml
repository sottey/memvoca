[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memvoca-server"
version = "0.1.0"
description = "Minimal local receiver for Memvoca Phase 1 transport testing"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<16"]

[project.scripts]
memvoca-receiver = "memvoca_server.receiver:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
